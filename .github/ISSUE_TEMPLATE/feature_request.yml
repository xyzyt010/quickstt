name: Feature request
description: Suggest an improvement to QuickSTT
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user impact
      description: Who benefits and why?
      placeholder: As a Mint user I want ...
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: Describe the change, including UI if relevant.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [GUI, Audio, STT/VAD, Wakeword, Packaging, Docs, Other]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
