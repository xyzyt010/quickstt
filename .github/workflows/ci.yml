name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-check:
    name: Rust check + test (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quickstt-rust
      - name: System deps (gtk, appindicator, portaudio, x11)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake protobuf-compiler \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev portaudio19-dev \
            libx11-dev libxi-dev libxtst-dev libxdo-dev libssl-dev
      - name: cargo check (workspace)
        working-directory: quickstt-rust
        run: cargo check --workspace
      - name: cargo test (core)
        working-directory: quickstt-rust
        run: cargo test -p quickstt-core --lib --offline || cargo test -p quickstt-core --lib
      - name: cargo build --release (native)
        working-directory: quickstt-rust
        run: cargo build --release
      - name: Verify binary
        run: |
          file quickstt-rust/target/release/QuickSTT
          ldd quickstt-rust/target/release/QuickSTT | head -20
          ls -lh quickstt-rust/target/release/QuickSTT

  rust-check-windows:
    name: Rust check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quickstt-rust
      - name: cargo check
        working-directory: quickstt-rust
        run: cargo check
      - name: cargo test (core)
        working-directory: quickstt-rust
        run: cargo test -p quickstt-core --lib

  cpp-linux:
    name: C++ stt_service (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake portaudio19-dev
      - name: Configure (Linux — Qt6 optional)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release || cat build/CMakeFiles/CMakeError.log
      - name: Build stt_service
        run: cmake --build build --target stt_service_native -j"$(nproc)" || echo "stt_service optional"
      - name: ldd
        run: ldd build/stt_service 2>&1 | head -20 || true

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rustfmt
        working-directory: quickstt-rust
        run: cargo fmt --check || echo "run cargo fmt"
      - name: clippy
        working-directory: quickstt-rust
        run: cargo clippy --workspace -- -D warnings || true
