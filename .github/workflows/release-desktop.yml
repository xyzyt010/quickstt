name: Desktop Release

on:
  push:
    tags: [ "desktop-v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. desktop-v2.0.0)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-deb-appimage:
    name: Linux deb + AppImage (Ubuntu 22.04 amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quickstt-rust
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake protobuf-compiler \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev portaudio19-dev \
            libx11-dev libxi-dev libxtst-dev libxdo-dev libssl-dev \
            libopenblas-dev \
            qt6-base-dev libqt6svg6-dev qt6-multimedia-dev \
            libgl1-mesa-dev \
            file patchelf zsync desktop-file-utils
          cargo install cargo-deb --locked || true
          wget -q -O /tmp/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy; sudo mv /tmp/linuxdeploy /usr/local/bin/linuxdeploy
          wget -q -O /tmp/gtk-plugin.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x /tmp/gtk-plugin.sh; sudo mv /tmp/gtk-plugin.sh /usr/local/bin/linuxdeploy-plugin-gtk.sh
      - name: Cargo build --release
        working-directory: quickstt-rust
        run: cargo build --release
      - name: Build parakeet_engine (Parakeet TDT runtime)
        working-directory: parakeet_engine
        run: |
          cargo build --release
          mkdir -p ../quickstt-rust/target/release/tools/parakeet
          cp -f target/release/parakeet_engine ../quickstt-rust/target/release/tools/parakeet/
          file ../quickstt-rust/target/release/tools/parakeet/parakeet_engine
      - name: Stage wakeword models for tarball
        run: |
          mkdir -p quickstt-rust/target/release/wakeword_models
          cp -f wakeword_models/hey_jarvis_v0.1.onnx wakeword_models/alexa_v0.1.onnx quickstt-rust/target/release/wakeword_models/
          cp -r quickstt-rust/wakeword_models quickstt-rust/target/release/wakeword_models_legacy || true
      - name: Stage Photon worker (Parakeet Ultra/Redux runtime)
        run: |
          mkdir -p quickstt-rust/target/release/tools/photon
          cp -f quickstt-rust/tools/photon/photon_worker.py quickstt-rust/target/release/tools/photon/
          ls -lh quickstt-rust/target/release/tools/photon/
      - name: Stage Canary + disfluency workers (NeMo SALM runtime, filler cleanup)
        run: |
          mkdir -p quickstt-rust/target/release/tools/canary quickstt-rust/target/release/tools/disfluency
          cp -f quickstt-rust/tools/canary/canary_worker.py quickstt-rust/target/release/tools/canary/
          cp -f quickstt-rust/tools/disfluency/disfluency_worker.py quickstt-rust/target/release/tools/disfluency/
          ls -lh quickstt-rust/target/release/tools/canary/ quickstt-rust/target/release/tools/disfluency/
      - name: Build whisper.cpp (Whisper GGML engine)
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp /tmp/wcpp
          cmake -S /tmp/wcpp -B /tmp/wcpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_C_FLAGS="-march=x86-64 -mtune=generic" -DCMAKE_CXX_FLAGS="-march=x86-64 -mtune=generic"
          cmake --build /tmp/wcpp/build -j"$(nproc)" --target whisper-cli || cmake --build /tmp/wcpp/build -j"$(nproc)"
          mkdir -p quickstt-rust/target/release/tools/whisper_cpp
          BIN_W="$(find /tmp/wcpp/build -maxdepth 3 -type f -name whisper-cli | head -1)"
          if [ -z "$BIN_W" ]; then BIN_W="$(find /tmp/wcpp/build -maxdepth 3 -type f -name main | head -1)"; fi
          [ -n "$BIN_W" ] || { echo "whisper-cli binary not found"; find /tmp/wcpp/build -maxdepth 3 -type f | head -20; exit 1; }
          cp -f "$BIN_W" quickstt-rust/target/release/tools/whisper_cpp/whisper-cli
          file quickstt-rust/target/release/tools/whisper_cpp/whisper-cli
      - name: Build transcribe.cpp (Nemotron GGUF engine)
        run: |
          git clone --depth 1 https://github.com/handy-computer/transcribe.cpp /tmp/tcpp
          cmake -S /tmp/tcpp -B /tmp/tcpp/build -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DCMAKE_C_FLAGS="-march=x86-64 -mtune=generic" \
            -DCMAKE_CXX_FLAGS="-march=x86-64 -mtune=generic"
          cmake --build /tmp/tcpp/build -j"$(nproc)"
          mkdir -p quickstt-rust/target/release/tools/nemotron
          cp -f /tmp/tcpp/build/bin/transcribe-cli quickstt-rust/target/release/tools/nemotron/
          file quickstt-rust/target/release/tools/nemotron/transcribe-cli
          ldd quickstt-rust/target/release/tools/nemotron/transcribe-cli | head -20
      - name: Build llama.cpp (LFM3-Audio engine, llama-cli)
        run: |
          # Pinned release tag b11960 (v0.8.0) — the minimum version that
          # supports LFM3-Audio. GGML_NATIVE=OFF keeps the binary portable
          # (no -march flags leak across hosts), GGML_OPENMP=OFF avoids a
          # libgomp1 dependency the deb doesn't otherwise need.
          # LLAMA_USE_PREBUILT_UI=OFF: we only build llama-cli (the LFM3-Audio
          # engine), never the embedded web UI. Upstream's `llama-ui-assets`
          # target is ALL and otherwise downloads a HF bucket whose dist layout
          # changed (bundle[hash].js etc.), failing CMake validation. Skipping
          # the prebuilt UI produces an empty ui.cpp — harmless for llama-cli.
          git clone --depth 1 --branch b11960 https://github.com/ggml-org/llama.cpp /tmp/llamacpp
          cmake -S /tmp/llamacpp -B /tmp/llamacpp/build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DCMAKE_C_FLAGS="-march=x86-64 -mtune=generic" \
            -DCMAKE_CXX_FLAGS="-march=x86-64 -mtune=generic"
          cmake --build /tmp/llamacpp/build -j"$(nproc)" --target llama-cli
          mkdir -p quickstt-rust/target/release/tools/lfm3_audio
          BIN_LLM="$(find /tmp/llamacpp/build -maxdepth 3 -type f -name llama-cli | head -1)"
          [ -n "$BIN_LLM" ] || { echo "llama-cli binary not found"; find /tmp/llamacpp/build -maxdepth 3 -type f | head -20; exit 1; }
          cp -f "$BIN_LLM" quickstt-rust/target/release/tools/lfm3_audio/llama-cli
          file quickstt-rust/target/release/tools/lfm3_audio/llama-cli
          ldd quickstt-rust/target/release/tools/lfm3_audio/llama-cli | head -20
      # The legacy Qt/C++ build products (quickstt-app, stt_service) are no
      # longer shipped: they aren't exec'd by the Rust Slint app and aren't
      # referenced by the Linux desktop entry — dropping them entirely
      # removes the Qt toolchain dependency from the Linux release, shortens
      # the CI build, and removes ~5 MB of dead weight from the package.
      - name: cargo deb
        working-directory: quickstt-rust
        run: |
          cargo deb --no-build -p quickstt-slint
          ls -lh target/debian/*.deb
          mkdir -p dist
          cp -f target/debian/*.deb dist/
      - name: AppImage
        working-directory: quickstt-rust
        run: |
          mkdir -p dist
          BIN="target/release/quickstt-slint"
          cp -f assets/icon_app.png assets/quickstt.png
          linuxdeploy --appdir dist/AppDir -e "$BIN" -d assets/quickstt.desktop -i assets/quickstt.png --plugin gtk --output appimage > dist/linuxdeploy.log 2>&1 || true
          tail -n 25 dist/linuxdeploy.log || true
          mkdir -p dist/AppDir/usr/bin/wakeword_models
          cp -f target/release/wakeword_models/*.onnx dist/AppDir/usr/bin/wakeword_models/ 2>/dev/null || true
          mkdir -p dist/AppDir/usr/bin/tools/photon
          cp -f target/release/tools/photon/photon_worker.py dist/AppDir/usr/bin/tools/photon/ 2>/dev/null || true
          mkdir -p dist/AppDir/usr/bin/tools/canary dist/AppDir/usr/bin/tools/disfluency
          cp -f target/release/tools/canary/canary_worker.py dist/AppDir/usr/bin/tools/canary/ 2>/dev/null || true
          cp -f target/release/tools/disfluency/disfluency_worker.py dist/AppDir/usr/bin/tools/disfluency/ 2>/dev/null || true
          mkdir -p dist/AppDir/usr/bin/tools/whisper_cpp
          cp -f target/release/tools/whisper_cpp/whisper-cli dist/AppDir/usr/bin/tools/whisper_cpp/ 2>/dev/null || true
          mkdir -p dist/AppDir/usr/bin/tools/lfm3_audio
          cp -f target/release/tools/lfm3_audio/llama-cli dist/AppDir/usr/bin/tools/lfm3_audio/ 2>/dev/null || true
          cp -f assets/Inter-VariableFont.ttf dist/AppDir/usr/bin/Inter-VariableFont.ttf 2>/dev/null || true
          cp -f assets/MaterialSymbolsOutlined.ttf dist/AppDir/usr/bin/MaterialSymbolsOutlined.ttf 2>/dev/null || true
          mkdir -p dist/AppDir/usr/lib/quickstt
          cp -f assets/Inter-VariableFont.ttf dist/AppDir/usr/lib/quickstt/Inter-VariableFont.ttf 2>/dev/null || true
          cp -f assets/MaterialSymbolsOutlined.ttf dist/AppDir/usr/lib/quickstt/MaterialSymbolsOutlined.ttf 2>/dev/null || true
          if ! ls dist/*.AppImage 1>/dev/null 2>&1; then
            echo "AppImage failed — building plain tarball payload"
            rm -rf dist/payload && mkdir -p dist/payload
            cp -f "$BIN" dist/payload/QuickSTT
            cp -f ../Source/mic_active.svg ../Source/mic_inactive.svg ../Source/Untitled-1.svg dist/payload/ 2>/dev/null || true
            cp -f assets/icon_app.png dist/payload/icon_app.png 2>/dev/null || true
            cp -f assets/Inter-VariableFont.ttf dist/payload/Inter-VariableFont.ttf
            cp -f assets/MaterialSymbolsOutlined.ttf dist/payload/MaterialSymbolsOutlined.ttf
            cp -r target/release/tools dist/payload/tools 2>/dev/null || true
            cp -r target/release/wakeword_models dist/payload/wakeword_models 2>/dev/null || true
            mkdir -p dist/payload/assets
            cp -f assets/quickstt.desktop assets/icon_app.png dist/payload/assets/
            tar czf "dist/quickstt-${GITHUB_REF_NAME:-local}-x86_64.tar.gz" -C dist/payload .
            tar tzf "dist/quickstt-${GITHUB_REF_NAME:-local}-x86_64.tar.gz" | head -20
          fi
          ls -lh dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            quickstt-rust/dist/*.deb
            quickstt-rust/dist/*.AppImage
            quickstt-rust/dist/*.tar.gz
            quickstt-rust/dist/SHA256SUMS

  build-windows:
    name: Windows Portable (Rust Slint app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quickstt-rust
      - name: Stage LFM3-Audio runtime (llama.cpp b11960 win-cpu-x64)
        shell: pwsh
        # The portable exe bundles the official llama.cpp CPU binary: the app
        # shells out to llama-cli for LFM3-Audio GGUF models. Not built from
        # source here (the Qt/MinGW toolchain in this job is wrong for ggml);
        # the pinned official zip ships llama-cli.exe + every ggml/mtmd DLL it
        # loads, dispatched to any x64 CPU at runtime.
        run: |
          $url = 'https://github.com/ggml-org/llama.cpp/releases/download/b11960/llama-b11960-bin-win-cpu-x64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'llama-b11960-bin-win-cpu-x64.zip'
          & curl.exe -L --fail --retry 3 -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp runtime download failed" }
          New-Item -ItemType Directory -Force -Path 'tools\lfm3_audio' | Out-Null
          $extract = Join-Path $env:RUNNER_TEMP 'lfm3_stage'
          Expand-Archive $zip -DestinationPath $extract -Force
          $copied = Get-ChildItem $extract -Recurse -File | Where-Object { $_.Extension -eq '.dll' -or $_.Name -ieq 'llama-cli.exe' }
          foreach ($f in $copied) { Copy-Item $f.FullName (Join-Path 'tools\lfm3_audio' $f.Name) -Force }
          Write-Host "staged $($copied.Count) files into tools\lfm3_audio"
      - name: Build whisper.cpp (Whisper GGML engine)
        shell: pwsh
        # The Windows job built nothing usable for years — the Qt/MinGW toolchain
        # was wrong for ggml and the portable came out empty. whisper.cpp is a
        # clean MSVC build (no -march flags), static ggml, CPU-only.
        run: |
          $wcpp = Join-Path $env:RUNNER_TEMP 'whisper-cpp'
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp $wcpp
          if ($LASTEXITCODE -ne 0) { throw "whisper.cpp clone failed" }
          cmake -S $wcpp -B "$wcpp\build" -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF
          if ($LASTEXITCODE -ne 0) { throw "whisper.cpp configure failed" }
          cmake --build "$wcpp\build" --config Release -j $env:NUMBER_OF_PROCESSORS --target whisper-cli
          if ($LASTEXITCODE -ne 0) { throw "whisper.cpp build failed" }
          New-Item -ItemType Directory -Force -Path 'tools\whisper_cpp' | Out-Null
          Copy-Item "$wcpp\build\bin\Release\whisper-cli.exe" 'tools\whisper_cpp\whisper-cli.exe' -Force
          Write-Host 'whisper-cli staged'
      - name: Cargo build (Rust GUI)
        working-directory: quickstt-rust
        run: cargo build -p quickstt-slint --release
      - name: Stage Windows portable (Rust Slint app)
        shell: pwsh
        # The Windows Portable job previously only produced an empty artifact:
        # the Qt/C++ "Portable" build silently failed (it has not shipped a
        # portable in any recent release) and these uploads just warned.
        # Stage the same payload the installer ships as ONE self-contained
        # directory so "Windows portable" download products actually run.
        run: |
          $src = 'QuickSTT-Portable'
          if (Test-Path $src) { Remove-Item $src -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          $root = 'quickstt-rust'
          $exe = Join-Path $root 'target\release\quickstt-slint.exe'
          Copy-Item $exe (Join-Path $src 'QuickSTT.exe')
          if (Test-Path 'wakeword_models') {
            Copy-Item 'wakeword_models' (Join-Path $src 'wakeword_models') -Recurse
          }
          Copy-Item 'quickstt-rust\assets\Inter-VariableFont.ttf' (Join-Path $src 'Inter-VariableFont.ttf')
          Copy-Item 'quickstt-rust\assets\MaterialSymbolsOutlined.ttf' (Join-Path $src 'MaterialSymbolsOutlined.ttf')
          Copy-Item 'quickstt-rust\assets\Inter-VariableFont.ttf.license' (Join-Path $src 'Inter-VariableFont.ttf.license')
          Copy-Item 'quickstt-rust\assets\icon_app.png' (Join-Path $src 'icon_app.png')
          Copy-Item 'icon_app.ico' (Join-Path $src 'icon_app.ico')
          Copy-Item 'LICENSE' (Join-Path $src 'LICENSE.txt')
          # ── STT engines (everything staged earlier in this job lands in
          # repo-root tools/). Absent engines are skipped with a note; the one
          # engine whose absence would brick fresh installs (whisper) is
          # verified explicitly below.
          function Copy-Engine {
            param([string] $path)
            if (Test-Path $path) {
              $leaf = Split-Path $path -Leaf
              Copy-Item $path (Join-Path $src "tools\$leaf") -Recurse -Force
              "staged $leaf"
            } else { "skip $path (not staged on this runner)" }
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $src 'tools') | Out-Null
          foreach ($d in @('tools\whisper_cpp', 'tools\lfm3_audio')) { Copy-Engine $d }
          # Parakeet engine ships in git (repo-root tools/parakeet); exclude
          # DirectML.dll like the installer does (GPU-only extra).
          if (Test-Path 'tools\parakeet') {
            $dst = Join-Path $src 'tools\parakeet'
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            foreach ($f in Get-ChildItem 'tools\parakeet' -Recurse -File) {
              if ($f.Name -ieq 'DirectML.dll') { continue }
              Copy-Item $f.FullName (Join-Path $dst $f.Name) -Force
            }
            Write-Host 'staged parakeet (DirectML excluded)'
          } else { Write-Host 'skip parakeet' }
          # Nemotron transcribe-cli ships in git (quickstt-rust/tools/nemotron) —
          # prefer it; the repo-root runtime (untracked, dev machine only) wins
          # if present.
          $nemotronDst = Join-Path $src 'tools\nemotron'
          New-Item -ItemType Directory -Force -Path $nemotronDst | Out-Null
          if (Test-Path 'tools\nemotron\transcribe-cli.exe') {
            Get-ChildItem 'tools\nemotron' -Recurse -File | ForEach-Object {
              if ($_.Name -match '^(ggml-vulkan|.*\.bak|.*\.def|.*\.py|libtranscribe\.a|DirectML)') { return }
              Copy-Item $_.FullName (Join-Path $nemotronDst $_.Name) -Force
            }
            Write-Host 'staged repo-root nemotron runtime'
          } else {
            Copy-Item 'quickstt-rust\tools\nemotron\transcribe-cli.exe' (Join-Path $nemotronDst 'transcribe-cli.exe') -Force
            Write-Host 'staged tracked nemotron transcribe-cli.exe'
          }
          # Python workers (Photon / Canary / disfluency) ship in git.
          foreach ($d in @('photon', 'canary', 'disfluency')) {
            $srcDir = "quickstt-rust\tools\$d"
            if (-not (Test-Path $srcDir)) { Write-Host "skip $d"; continue }
            $dst = Join-Path (Join-Path $src 'tools') $d
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item (Join-Path $srcDir '*.py') $dst -Force
            Write-Host "staged $d"
          }
          # A README the user always sees after unzipping.
          $readme = "QuickSTT portable`n=================`n`nDouble-click QuickSTT.exe to run it. Everything needed ships next to the exe;`nmodels download on demand (Speech Models tab).`n`nBundled engines: Whisper (whisper-cli), Parakeet (parakeet_engine), Nemotron`n(transcribe-cli), LFM3-Audio (llama-cli, via the llama.cpp project).`nGPU acceleration is not bundled — CPU-only build.`n`nThe tray icon right-click is the same menu the app has always had.`n"
          Set-Content -Path (Join-Path $src 'README.txt') -Value $readme -Encoding UTF8
          if (-not (Test-Path (Join-Path $src 'QuickSTT.exe'))) { throw 'portable stage is missing QuickSTT.exe' }
          if (-not (Test-Path (Join-Path $src 'tools\whisper_cpp\whisper-cli.exe'))) {
            throw 'portable stage is missing the whisper.cpp engine staged earlier in this job'
          }
          Write-Host "portable staged at $src"
          Get-ChildItem $src -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "total MB: {0:N1}" -f ($_.Sum / 1MB) }
          Get-ChildItem $src -Recurse | Select-Object FullName | ForEach-Object { $_.FullName }
      - name: Zip Windows portable
        shell: pwsh
        run: Compress-Archive -Path 'QuickSTT-Portable' -DestinationPath "quickstt-windows-portable.zip" -Force
      - name: Rename portable zip per tag
        shell: pwsh
        run: Copy-Item "quickstt-windows-portable.zip" "quickstt-${{ github.ref_name }}-win64-portable.zip" -Force
      - name: Upload LFM3-Audio runtime artifact
        if: always()
        # The 24 MB staged runtime, for the maintainer's local installer build
        # (the installer build stages it separately, not the portable zip).
        uses: actions/upload-artifact@v4
        with:
          name: lfm3-audio-runtime
          path: tools/lfm3_audio
      - name: Upload Windows portable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          # The setup exe is built locally (untracked); the portable zip is
          # what CI publishes into the release.
          path: quickstt-${{ github.ref_name }}-win64-portable.zip

  publish-release:
    name: Publish Desktop Release
    needs: [build-linux-deb-appimage, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*-win64-portable.zip" -o -name "QuickSTT-Setup-*.exe" -o -name "SHA256SUMS*" \) -exec cp -f {} release/ \;
          if [ -f release/SHA256SUMS.txt ]; then
            mv -f release/SHA256SUMS.txt release/SHA256SUMS_PORTABLE_WIN.txt
          fi
          ls -lh release/
          ( cd release && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS* -printf '%f\n' | sort) > SHA256SUMS && cat SHA256SUMS )
      - name: Release notes
        run: |
          VER="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # A quoted heredoc: backticked names must reach the notes as text.
          cat > /tmp/notes.md <<'NOTES'
          ## QuickSTT Desktop __VER__ — Linux · Windows

          Floating offline voice typing pill — wakeword, VAD, tray, global hotkeys.

          ### Desktop release (Rust & Slint)
          - Windows installer: `QuickSTT-Setup-*.exe` — full install with autostart,
            tray, wakewords, STT engines, and the intro tour on first launch.
          - Windows portable: `quickstt-desktop-v__VER__-win64-portable.zip` — unzip
            and double-click `QuickSTT.exe`. Same self-contained payload as the
            installer; models download on demand from Settings → Speech Models.
          - Linux: `.deb` (Mint/Ubuntu/Debian) or portable `.tar.gz`.

          ### Install — Linux
          ```bash
          # Any release asset: https://github.com/__REPO__/releases/download/__VER__/
          wget -O /tmp/quickstt.deb https://github.com/__REPO__/releases/download/__VER__/quickstt_*_amd64.deb
          sudo apt install -y /tmp/quickstt.deb && quickstt &
          ```
          Or portable tarball:
          ```bash
          wget -O /tmp/quickstt.tar.gz https://github.com/__REPO__/releases/download/__VER__/quickstt-__VER__-x86_64.tar.gz
          mkdir -p ~/quickstt && tar xzf /tmp/quickstt.tar.gz -C ~/quickstt && ~/quickstt/QuickSTT &
          ```

          ### Install — Windows
          - Install: run `QuickSTT-Setup-*.exe` and follow the wizard (launches the
            app and shows the intro tour on first launch).
          - Portable: unzip `quickstt-desktop-v__VER__-win64-portable.zip`,
            double-click `QuickSTT.exe`.

          ### Checksums
          See `SHA256SUMS`.
          NOTES
          sed -i "s|__VER__|${VER}|g; s|__REPO__|${REPO}|g" /tmp/notes.md
          cat /tmp/notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: /tmp/notes.md
          generate_release_notes: true
