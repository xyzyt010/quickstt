name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v2.0.0-alpha.1)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-deb-appimage:
    name: Linux deb + AppImage (Ubuntu 22.04 amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quickstt-rust
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake protobuf-compiler \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev portaudio19-dev \
            libx11-dev libxi-dev libxtst-dev libxdo-dev libssl-dev \
            libopenblas-dev \
            qt6-base-dev libqt6svg6-dev qt6-multimedia-dev \
            libgl1-mesa-dev \
            file patchelf zsync desktop-file-utils
          cargo install cargo-deb --locked || true
          # linuxdeploy
          wget -q -O /tmp/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy; sudo mv /tmp/linuxdeploy /usr/local/bin/linuxdeploy
          wget -q -O /tmp/gtk-plugin.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x /tmp/gtk-plugin.sh; sudo mv /tmp/gtk-plugin.sh /usr/local/bin/linuxdeploy-plugin-gtk.sh
      - name: Cargo build --release
        working-directory: quickstt-rust
        run: cargo build --release
      - name: Build parakeet_engine (Parakeet TDT runtime)
        working-directory: parakeet_engine
        run: |
          cargo build --release
          mkdir -p ../quickstt-rust/target/release/tools/parakeet
          cp -f target/release/parakeet_engine ../quickstt-rust/target/release/tools/parakeet/
          file ../quickstt-rust/target/release/tools/parakeet/parakeet_engine
      - name: Stage wakeword models for tarball
        run: |
          mkdir -p quickstt-rust/target/release/wakeword_models
          cp -f wakeword_models/hey_jarvis_v0.1.onnx wakeword_models/alexa_v0.1.onnx quickstt-rust/target/release/wakeword_models/
          cp -r quickstt-rust/wakeword_models quickstt-rust/target/release/wakeword_models_legacy || true
      - name: Stage Photon worker (Parakeet Ultra/Redux runtime)
        run: |
          mkdir -p quickstt-rust/target/release/tools/photon
          cp -f quickstt-rust/tools/photon/photon_worker.py quickstt-rust/target/release/tools/photon/
          ls -lh quickstt-rust/target/release/tools/photon/
      - name: Stage Canary + disfluency workers (NeMo SALM runtime, filler cleanup)
        run: |
          mkdir -p quickstt-rust/target/release/tools/canary quickstt-rust/target/release/tools/disfluency
          cp -f quickstt-rust/tools/canary/canary_worker.py quickstt-rust/target/release/tools/canary/
          cp -f quickstt-rust/tools/disfluency/disfluency_worker.py quickstt-rust/target/release/tools/disfluency/
          ls -lh quickstt-rust/target/release/tools/canary/ quickstt-rust/target/release/tools/disfluency/
      - name: Build whisper.cpp (Whisper GGML engine)
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp /tmp/wcpp
          # Static link: the deb ships one self-contained binary, no .so to
          # hunt (a shared build dies with "libwhisper.so.1 not found").
          # Portable baseline: CI runners carry AVX2/AVX-512 and ggml bakes
          # compile-time SIMD in — without this the binary dies SIGILL
          # ("Illegal instruction") on older Mint CPUs. x86-64 baseline runs
          # everywhere; Tiny is small enough that the speed cost is noise.
          cmake -S /tmp/wcpp -B /tmp/wcpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_C_FLAGS="-march=x86-64 -mtune=generic" -DCMAKE_CXX_FLAGS="-march=x86-64 -mtune=generic"
          cmake --build /tmp/wcpp/build -j"$(nproc)" --target whisper-cli || cmake --build /tmp/wcpp/build -j"$(nproc)"
          mkdir -p quickstt-rust/target/release/tools/whisper_cpp
          BIN_W="$(find /tmp/wcpp/build -maxdepth 3 -type f -name whisper-cli | head -1)"
          if [ -z "$BIN_W" ]; then BIN_W="$(find /tmp/wcpp/build -maxdepth 3 -type f -name main | head -1)"; fi
          [ -n "$BIN_W" ] || { echo "whisper-cli binary not found"; find /tmp/wcpp/build -maxdepth 3 -type f | head -20; exit 1; }
          cp -f "$BIN_W" quickstt-rust/target/release/tools/whisper_cpp/whisper-cli
          file quickstt-rust/target/release/tools/whisper_cpp/whisper-cli
      - name: Build transcribe.cpp (Nemotron GGUF engine)
        run: |
          git clone --depth 1 https://github.com/handy-computer/transcribe.cpp /tmp/tcpp
          # Portable baseline: ggml bakes -march=native in by default (GGML_NATIVE=ON),
          # so a runner with AVX-512 produces a binary that dies with SIGILL
          # ("Illegal instruction") on older CPUs — every transcription then fails
          # while the model and the audio are fine. x86-64 baseline runs everywhere.
          cmake -S /tmp/tcpp -B /tmp/tcpp/build -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DCMAKE_C_FLAGS="-march=x86-64 -mtune=generic" \
            -DCMAKE_CXX_FLAGS="-march=x86-64 -mtune=generic"
          cmake --build /tmp/tcpp/build -j"$(nproc)"
          mkdir -p quickstt-rust/target/release/tools/nemotron
          cp -f /tmp/tcpp/build/bin/transcribe-cli quickstt-rust/target/release/tools/nemotron/
          file quickstt-rust/target/release/tools/nemotron/transcribe-cli
          ldd quickstt-rust/target/release/tools/nemotron/transcribe-cli | head -20
      - name: CMake native backend + Qt widget GUI (stt_service + quickstt-app)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DCMAKE_C_FLAGS="-march=x86-64 -mtune=generic" \
            -DCMAKE_CXX_FLAGS="-march=x86-64 -mtune=generic"
          cmake --build build --target stt_service_native QuickSTT_App -j"$(nproc)"
          file build/stt_service build/quickstt-app
          ldd build/quickstt-app | grep -i "not found" && exit 1 || true
          cp -f build/stt_service quickstt-rust/target/release/stt_service
          cp -f build/quickstt-app quickstt-rust/target/release/quickstt-app
      - name: cargo deb
        working-directory: quickstt-rust
        run: |
          cargo deb --no-build -p quickstt-slint
          ls -lh target/debian/*.deb
          mkdir -p dist
          cp -f target/debian/*.deb dist/
          dpkg-deb -I dist/*.deb | head -40
          dpkg -c dist/*.deb | head -30
      - name: AppImage
        working-directory: quickstt-rust
        run: |
          mkdir -p dist
          BIN="target/release/quickstt-slint"
          STT="target/release/stt_service"
          # linuxdeploy requires the icon basename to match desktop Icon= entry
          cp -f assets/icon_app.png assets/quickstt.png
          EXTRA=""
          [[ -f "$STT" ]] && EXTRA="-e $STT"
          linuxdeploy --appdir dist/AppDir -e "$BIN" $EXTRA -d assets/quickstt.desktop -i assets/quickstt.png --plugin gtk --output appimage > dist/linuxdeploy.log 2>&1 || true
          # Surface WHY the AppImage failed (the gtk plugin often cannot
          # auto-detect the GTK version) instead of silently shipping only
          # the tarball.
          tail -n 25 dist/linuxdeploy.log || true
          # Bundle the OWW wakeword heads next to the binary inside the AppDir
          # (the app's exe-adjacent lookup finds them there on first run).
          mkdir -p dist/AppDir/usr/bin/wakeword_models
          cp -f target/release/wakeword_models/*.onnx dist/AppDir/usr/bin/wakeword_models/ 2>/dev/null || true
          # Bundle the Photon worker the same way (deb covers it via assets;
          # AppImage/tarball need it next to the binary).
          mkdir -p dist/AppDir/usr/bin/tools/photon
          cp -f target/release/tools/photon/photon_worker.py dist/AppDir/usr/bin/tools/photon/ 2>/dev/null || true
          # Bundle the Canary + disfluency workers the same way.
          mkdir -p dist/AppDir/usr/bin/tools/canary dist/AppDir/usr/bin/tools/disfluency
          cp -f target/release/tools/canary/canary_worker.py dist/AppDir/usr/bin/tools/canary/ 2>/dev/null || true
          cp -f target/release/tools/disfluency/disfluency_worker.py dist/AppDir/usr/bin/tools/disfluency/ 2>/dev/null || true
          # Bundle whisper-cli the same way (the Whisper engine binary).
          mkdir -p dist/AppDir/usr/bin/tools/whisper_cpp
          cp -f target/release/tools/whisper_cpp/whisper-cli dist/AppDir/usr/bin/tools/whisper_cpp/ 2>/dev/null || true
          if ! ls dist/*.AppImage 1>/dev/null 2>&1; then
            echo "AppImage failed — building plain tarball payload"
            rm -rf dist/payload && mkdir -p dist/payload
            cp -f "$BIN" dist/payload/QuickSTT
            cp -f "$STT" dist/payload/stt_service 2>/dev/null || true
            cp -f target/release/quickstt-app dist/payload/quickstt-app 2>/dev/null || true
            cp -f target/release/stt_service dist/payload/stt_service 2>/dev/null || true
            # SVG assets consumed by the Qt widget app at runtime
            cp -f ../Source/mic_active.svg ../Source/mic_inactive.svg ../Source/Untitled-1.svg dist/payload/ 2>/dev/null || true
            cp -f assets/icon_app.png dist/payload/icon_app.png 2>/dev/null || true
            cp -r target/release/tools dist/payload/tools 2>/dev/null || true
            cp -r target/release/wakeword_models dist/payload/wakeword_models 2>/dev/null || true
            mkdir -p dist/payload/assets
            cp -f assets/quickstt.desktop assets/icon_app.png dist/payload/assets/
            tar czf "dist/quickstt-${GITHUB_REF_NAME:-local}-x86_64.tar.gz" -C dist/payload .
            tar tzf "dist/quickstt-${GITHUB_REF_NAME:-local}-x86_64.tar.gz" | head -20
          fi
          ls -lh dist/*
      - name: SHA256SUMS
        working-directory: quickstt-rust
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum *.deb 2>/dev/null >> SHA256SUMS || true
          sha256sum *.AppImage 2>/dev/null >> SHA256SUMS || true
          sha256sum *.tar.gz 2>/dev/null >> SHA256SUMS || true
          cat SHA256SUMS
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            quickstt-rust/dist/*.deb
            quickstt-rust/dist/*.AppImage
            quickstt-rust/dist/*.tar.gz
            quickstt-rust/dist/SHA256SUMS

  build-windows:
    name: Windows Portable (Qt + Rust)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quickstt-rust
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtmultimedia'
      - name: Cargo build (Rust GUI)
        working-directory: quickstt-rust
        run: cargo build -p quickstt-slint --release
      - name: CMake Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release || echo "Qt not available, skipping"
          cmake --build build --target QuickSTT_App -j 4 || echo "Qt build skipped"
          cmake --build build --target stt_service_native -j 4 || echo "stt_service build skipped"
          dir build\*.exe 2>$null; dir QuickSTT_App\*.exe 2>$null
      - name: Build Portable
        shell: pwsh
        if: always()
        run: |
          if (Test-Path .\BuildApp.bat) { .\BuildApp.bat } else { echo "BuildApp.bat not found" }
          if (Test-Path QuickSTT_Portable.exe) { dir QuickSTT_Portable.exe }
          if (Test-Path QuickSTT_DirectDownload\SHA256SUMS.txt) { Get-Content QuickSTT_DirectDownload\SHA256SUMS.txt | Select-Object -First 10 }
      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            QuickSTT_Portable.exe
            QuickSTT_DirectDownload/SHA256SUMS.txt
            QuickSTT_DirectDownload/release_manifest.json
            build/stt_service.exe
            QuickSTT_App/QuickSTT_App.exe
            quickstt-rust/target/release/QuickSTT.exe

  build-android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-22.04
    # A broken Android build must never block the desktop release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Install the Android platform and build tools
        # The bubble helper is compiled against android.jar and the dex is
        # built with d8, so both have to be in the SDK.
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || find "${{ steps.ndk.outputs.android-sdk }}" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Restore the release keystore
        # The keystore is not in the repo (see android/README.md). It comes
        # from the ANDROID_KEYSTORE_BASE64 secret so the published APK is
        # signed with the same key as the local builds (an app update
        # needs the same signature).
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/quickstt-release.jks
            echo "using the release keystore"
          else
            echo "no keystore secret — generating a throwaway key"
            keytool -genkeypair -v -keystore android/quickstt-release.jks \
              -alias quickstt -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass quickstt -keypass quickstt \
              -dname "CN=QuickSTT, OU=CI, O=QuickSTT, L=, S=, C=US"
          fi
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ steps.ndk.outputs.android-sdk }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_SDK_ROOT: ${{ steps.ndk.outputs.android-sdk }}
        run: cargo apk build --release --target aarch64-linux-android --lib
      - name: Add the bubble helper and sign the APK
        # cargo-apk cannot put a dex into an APK, so the floating bubble's
        # Java class is compiled here and the APK is finished by hand:
        # classes.dex + the speech engines -> zipalign -> apksigner.
        working-directory: android
        env:
          ANDROID_HOME: ${{ steps.ndk.outputs.android-sdk }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          PLATFORM="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)"
          mkdir -p target/dex/classes target/dex/dex
          javac --release 8 -nowarn -classpath "$PLATFORM/android.jar" \
            -d target/dex/classes \
            java/ai/quickstt/app/Bubble.java java/ai/quickstt/app/Engine.java
          "$BUILD_TOOLS"/d8 --min-api 26 --output target/dex/dex \
            target/dex/classes/ai/quickstt/app/Bubble.class \
            target/dex/classes/ai/quickstt/app/Engine.class
          python3 - <<'PY'
          import zipfile
          src = "target/release/apk/quickstt-android.apk"
          dst = "target/dex/with-dex.apk"
          # The engines go into the APK's lib directory: the installer
          # extracts them into the app's native library directory, which is
          # the only place where Android lets an app run a program.
          engines = [
              ("libwhisper-cli.so", "prebuilt/whisper-cli-arm64-v8a"),
              ("libneedle.so", "prebuilt/needle-arm64-v8a"),
              ("libtranscribe-cli.so", "prebuilt/transcribe-cli-arm64-v8a"),
          ]
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w") as zout:
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  info = zipfile.ZipInfo(item.filename, date_time=item.date_time)
                  info.compress_type = item.compress_type
                  info.external_attr = item.external_attr
                  info.create_system = item.create_system
                  zout.writestr(info, data)
              zout.write("target/dex/dex/classes.dex", "classes.dex")
              for name, path in engines:
                  with open(path, "rb") as handle:
                      data = handle.read()
                  info = zipfile.ZipInfo("lib/arm64-v8a/" + name,
                                         date_time=item.date_time)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o755 << 16
                  zout.writestr(info, data)
          PY
          "$BUILD_TOOLS"/zipalign -f -p 4 target/dex/with-dex.apk target/dex/aligned.apk
          "$BUILD_TOOLS"/apksigner sign --ks quickstt-release.jks --ks-key-alias quickstt \
            --ks-pass pass:quickstt --key-pass pass:quickstt \
            --out target/release/apk/quickstt-android.apk target/dex/aligned.apk
          "$BUILD_TOOLS"/apksigner verify target/release/apk/quickstt-android.apk
          "$BUILD_TOOLS"/aapt2 dump badging target/release/apk/quickstt-android.apk | head -5
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: android/target/release/apk/quickstt-android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux-deb-appimage, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "SHA256SUMS*" -o -name "QuickSTT_Portable.exe" -o -name "QuickSTT.exe" -o -name "quickstt-android.apk" \) -exec cp -f {} release/ \;
          # The Android asset gets a stable, descriptive name.
          if [ -f release/quickstt-android.apk ]; then
            mv -f release/quickstt-android.apk release/quickstt-android-release.apk
          fi
          ls -lh release/
          (cd release && sha256sum * | tee SHA256SUMS; cat SHA256SUMS)
      - name: Release notes
        run: |
          VER="${{ github.ref_name }}"
          # v2.0.0-alpha.5 -> quickstt_2.0.0.alpha.5-1_amd64.deb (cargo-deb mangles dashes)
          DEB_NAME="quickstt_$(echo "${VER#v}" | sed 's/-/./')-1_amd64.deb"
          echo "DEB_NAME=$DEB_NAME"
          cat > /tmp/notes.md <<NOTES
          ## QuickSTT ${VER} — Ubuntu/Debian amd64 (Mint 21/22)

          Floating offline voice typing pill — wakeword, VAD, tray, global hotkeys.
          Models download in-app: Vosk small EN 50M · Parakeet TDT 0.6B v3 INT8 · Phonon-2 0.6B INT8 (Fermion Research, CC-BY-4.0) · Nemotron 3.5 ASR Streaming 0.6B Q8_0 (716MB, transcribe.cpp).
          Full C++ Qt widget app included — run \`quickstt-app\` for the classic Dashboard + Pill UI.

          ### What's new in this release (widget app)
          - New model: **Phonon-2 0.6B INT8** (Fermion Research, CC-BY-4.0) — 5.21% WER compact English model running on the same ONNX Runtime stack as Parakeet (Windows/Linux), with NOTICE + license shipped into the model dir.
          - Fixed backend crash-loop on Linux: libvosk.so now auto-provisioned with Vosk models; missing runtime no longer kills stt_service.
          - Models install to ~/.local/share/QuickSTT/models (shared with the Rust app + native service) — no more read-only /usr/lib failures.
          - Real SVG mic/app icons everywhere (pill, tray at all DPI sizes) — no more blue-dot fallback.
          - Robust Quit: engine killed on exit, tray item removed, no restart storms (non-blocking backoff).
          - **Ctrl+Shift+Space** toggles the new bottom-center micro-pill overlay · hold **Ctrl+Space** = push-to-talk (X11). Wayland: bind a compositor shortcut to \`quickstt-app --toggle-dictation\`.
          - Micro-pill overlay types into any focused window via xdotool (or clipboard), with live waveform + transcribing animation.
          - Polished model dropdown (dark rounded menu, hover selection).

          ### Linux Mint / Ubuntu / Debian — one-liner
          \`\`\`bash
          wget -O /tmp/quickstt.deb https://github.com/${{ github.repository }}/releases/download/${VER}/${DEB_NAME}
          sudo apt install -y /tmp/quickstt.deb && quickstt &
          \`\`\`
          Or tarball (no sudo):
          \`\`\`bash
          wget -O /tmp/quickstt.tar.gz https://github.com/${{ github.repository }}/releases/download/${VER}/quickstt-${VER}-x86_64.tar.gz
          mkdir -p ~/quickstt && tar xzf /tmp/quickstt.tar.gz -C ~/quickstt && ~/quickstt/QuickSTT &
          \`\`\`

          ### First-run setup
          1. Pill appears bottom-center. Right-click it → Dashboard → Models → **Download** next to *Vosk Small EN (50M)* and *Parakeet TDT 0.6B v3*.
          2. Tray icon in panel: left-click toggles pill, menu has Show / Hide / Dashboard / Quit.
          3. Hotkeys: **Ctrl+Shift+Space** toggle micro-pill dictation · hold **Ctrl+Space** push-to-talk · Ctrl+Shift+H show/hide main pill.

          ### Checksums
          See \`SHA256SUMS\`.

          ### Android (arm64-v8a)
          \`\`\`bash
          wget -O /tmp/quickstt.apk https://github.com/${{ github.repository }}/releases/download/${VER}/quickstt-android-release.apk
          adb install -r /tmp/quickstt.apk
          \`\`\`
          The touch app dictates for real: the microphone is captured with the NDK AAudio API, whisper.cpp (arm64-v8a, shipped inside the APK) transcribes on-device, the text is copied to the clipboard and a floating bubble shows the mic state above other apps. The Listen tab walks through the three setup steps (microphone permission → model download → overlay permission) and has a **Test mic** button. The 32 MB model is downloaded in-app, never bundled.
          NOTES
          cat /tmp/notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: /tmp/notes.md
          generate_release_notes: true
