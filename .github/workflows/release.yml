name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v2.0.0-alpha.1)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Install cargo-apk
        # Pinned: the APK metadata (the dex, the signing block) is tied to
        # this version, and a newer cargo-apk can change the manifest it
        # generates.
        run: cargo install cargo-apk --locked --version 0.10.0
      - name: Install the Android platform and build tools
        # The bubble helper is compiled against android.jar and the dex is
        # built with d8, so both have to be in the SDK. The runner image
        # usually ships them already; this only adds them when it does not.
        #
        # The SDK root is detected here and exported through GITHUB_ENV:
        # cargo-apk reads ANDROID_HOME and fails with
        #   Error: Path `"build-tools"` doesn't exist.
        # when it is empty. (The setup-ndk action has no `android-sdk`
        # output, so it must not be used for this.)
        run: |
          set -euo pipefail
          SDK=""
          for c in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" \
                   /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk; do
            if [ -n "$c" ] && [ -d "$c/build-tools" ] && [ -d "$c/platforms" ]; then SDK="$c"; break; fi
          done
          if [ -z "$SDK" ]; then
            for c in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" \
                     /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk; do
              if [ -n "$c" ] && [ -d "$c" ]; then SDK="$c"; break; fi
            done
          fi
          echo "sdk: ${SDK:-NOT FOUND}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "$SDK" ]; then
            for c in "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager; do
              if [ -x "$c" ]; then SDKMANAGER="$c"; break; fi
            done
          fi
          echo "sdkmanager: ${SDKMANAGER:-not found}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          ls -d "$SDK"/platforms/* 2>/dev/null || true
          ls -d "$SDK"/build-tools/* 2>/dev/null || true
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"
      - name: Restore the release keystore
        # The keystore is not in the repo (see android/README.md). It comes
        # from the ANDROID_KEYSTORE_BASE64 secret so the published APK is
        # signed with the same key as the local builds (an app update
        # needs the same signature).
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/quickstt-release.jks
            echo "using the release keystore"
          else
            echo "no keystore secret — generating a throwaway key"
            keytool -genkeypair -v -keystore android/quickstt-release.jks \
              -alias quickstt -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass quickstt -keypass quickstt \
              -dname "CN=QuickSTT, OU=CI, O=QuickSTT, L=, S=, C=US"
          fi
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          RUST_BACKTRACE: full
        run: |
          set -euo pipefail
          echo "cargo: $(cargo --version)"
          echo "rustc: $(rustc --version)"
          echo "sdk: ${ANDROID_HOME:-NOT SET}"
          echo "ndk: ${ANDROID_NDK_ROOT:-NOT SET}"
          # The C shim (AAudio) is compiled by the `cc` crate, which only
          # looks for the compiler on PATH — the NDK's clang is not there by
          # default and the build dies with
          #   failed to find tool "aarch64-linux-android-clang".
          # So the NDK toolchain is put on PATH and handed to the cc crate
          # directly.
          NDK_BIN=""
          for host in linux-x86_64 darwin-x86_64; do
            d="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/$host/bin"
            if [ -d "$d" ]; then NDK_BIN="$d"; break; fi
          done
          if [ -z "$NDK_BIN" ]; then
            NDK_BIN="$(dirname "$(find "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt" -name 'aarch64-linux-android*-clang' -type f | head -1)")"
          fi
          echo "ndk bin: $NDK_BIN"
          export PATH="$NDK_BIN:$PATH"
          CLANG="$(ls "$NDK_BIN"/aarch64-linux-android26-clang 2>/dev/null || true)"
          if [ -z "$CLANG" ]; then
            CLANG="$(ls "$NDK_BIN"/aarch64-linux-android*-clang 2>/dev/null | sort -V | tail -1)"
          fi
          export CC_aarch64_linux_android="$CLANG"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          echo "cc: $CC_aarch64_linux_android"
          cargo apk build --release --target aarch64-linux-android --lib
      - name: Add the helpers, the manifest and sign the APK
        # cargo-apk cannot put a dex into an APK and its manifest can only
        # describe an activity — QuickSTT needs a foreground service for the
        # floating bubble. So the APK is finished by hand here:
        # classes.dex + our own manifest + the speech engines
        # -> zipalign -> apksigner.
        working-directory: android
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          PLATFORM="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)"
          mkdir -p target/dex/classes target/dex/dex target/manifest
          javac --release 8 -nowarn -classpath "$PLATFORM/android.jar" \
            -d target/dex/classes \
            java/ai/quickstt/app/Bubble.java java/ai/quickstt/app/Overlay.java \
            java/ai/quickstt/app/Engine.java java/ai/quickstt/app/SpeechService.java \
            java/ai/quickstt/app/ModelDownloader.java \
            java/ai/quickstt/app/QuickSttInputMethodService.java
          "$BUILD_TOOLS"/d8 --min-api 26 --output target/dex/dex \
            target/dex/classes/ai/quickstt/app/*.class
          # Our own manifest: it declares the foreground service and the
          # Voice Auto-Type input method (no accessibility service, so
          # Play Protect does not block sideloaded installs).
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          MAJOR="${VERSION%%.*}"; REST="${VERSION#*.}"
          MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          VERSION_CODE=$((0x1000000 + MINOR * 256 + PATCH))
          if [ ! -f prebuilt/whistle.cact ]; then
            echo "Downloading Cactus Whistle model to embed in APK..."
            curl -L -o prebuilt/whistle.cact "https://huggingface.co/Cactus-Compute/whistle/resolve/main/whistle.cact"
          fi
          "$BUILD_TOOLS"/aapt2 compile --dir res -o target/manifest/res.zip
          "$BUILD_TOOLS"/aapt2 link -I "$PLATFORM/android.jar" \
            --manifest AndroidManifest.xml -R target/manifest/res.zip \
            --auto-add-overlay \
            --min-sdk-version 26 --target-sdk-version 34 \
            --version-code "$VERSION_CODE" --version-name "$VERSION" \
            -o target/manifest/manifest.apk
          python3 - <<'PY'
          import os, zipfile
          src = "target/release/apk/quickstt-android.apk"
          dst = "target/dex/with-dex.apk"
          # The engines go into the APK's lib directory: the installer
          # extracts them into the app's native library directory, which is
          # the only place where Android lets an app run a program.
          engines = [
              ("libwhisper-cli.so", "prebuilt/whisper-cli-arm64-v8a"),
              ("libneedle.so", "prebuilt/needle-arm64-v8a"),
              ("libtranscribe-cli.so", "prebuilt/transcribe-cli-arm64-v8a"),
          ]
          # Our own manifest and compiled resources (foreground service + IME).
          manifest_entries = {}
          with zipfile.ZipFile("target/manifest/manifest.apk") as zm:
              for mitem in zm.infolist():
                  manifest_entries[mitem.filename] = (mitem.compress_type, zm.read(mitem.filename))
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w") as zout:
              stamp = None
              for item in zin.infolist():
                  stamp = item.date_time
                  if item.filename in manifest_entries:
                      continue
                  data = zin.read(item.filename)
                  info = zipfile.ZipInfo(item.filename, date_time=item.date_time)
                  info.compress_type = item.compress_type
                  info.external_attr = item.external_attr
                  info.create_system = item.create_system
                  zout.writestr(info, data)
              for mname, (mcomp, mdata) in manifest_entries.items():
                  info = zipfile.ZipInfo(mname, date_time=stamp)
                  info.compress_type = zipfile.ZIP_STORED if mname == "resources.arsc" else zipfile.ZIP_DEFLATED
                  zout.writestr(info, mdata)
              zout.write("target/dex/dex/classes.dex", "classes.dex")
              # Bundle the Cactus model directly inside the APK assets
              if os.path.isfile("prebuilt/whistle.cact"):
                  with open("prebuilt/whistle.cact", "rb") as handle:
                      cdata = handle.read()
                  info = zipfile.ZipInfo("assets/models/whistle.cact", date_time=stamp)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  zout.writestr(info, cdata)
              for name, path in engines:
                  with open(path, "rb") as handle:
                      data = handle.read()
                  info = zipfile.ZipInfo("lib/arm64-v8a/" + name,
                                         date_time=stamp)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o755 << 16
                  zout.writestr(info, data)
          PY
          "$BUILD_TOOLS"/zipalign -f -p 4 target/dex/with-dex.apk target/dex/aligned.apk
          "$BUILD_TOOLS"/apksigner sign --ks quickstt-release.jks --ks-key-alias quickstt \
            --ks-pass pass:quickstt --key-pass pass:quickstt \
            --out target/release/apk/quickstt-android.apk target/dex/aligned.apk
          "$BUILD_TOOLS"/apksigner verify target/release/apk/quickstt-android.apk
          "$BUILD_TOOLS"/aapt2 dump badging target/release/apk/quickstt-android.apk | head -5
          "$BUILD_TOOLS"/aapt2 dump xmltree --file AndroidManifest.xml \
            target/release/apk/quickstt-android.apk | grep -E "service|extractNativeLibs"
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: android/target/release/apk/quickstt-android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          # Android-only releases from this tag on: no desktop artifacts.
          find artifacts -type f -name "quickstt-android.apk" -exec cp -f {} release/ \;
          mv -f release/quickstt-android.apk release/quickstt-android-release.apk
          ls -lh release/
          ( cd release && sha256sum quickstt-android-release.apk > SHA256SUMS && cat SHA256SUMS )
      - name: Release notes
        run: |
          VER="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # A quoted heredoc: backticked names must reach the notes as text.
          # __TOKENS__ are filled in afterwards via sed.
          cat > /tmp/notes.md <<'NOTES'
          ## QuickSTT __VER__ — Android (arm64-v8a)

          On-device, offline voice dictation for Android: a translucent floating
          pill you tap anywhere, plus a standard Voice Auto-Type keyboard that
          types live into any text box — no accessibility service, no root,
          nothing leaves the phone.

          ### Fixed & improved in this release (Android __VER__)
          - **Google Play Protect no longer blocks the install**: `BIND_ACCESSIBILITY_SERVICE` was removed in favour of Android's standard Voice Input Method (`QuickSttInputMethodService`, `BIND_INPUT_METHOD`). No SMS, notification-listener or accessibility permissions are declared.
          - **Floating pill only on tap**: the compact 48dp squircle is translucent grey and never appears at launch — enable it in Settings → Floating pill. One tap starts dictation immediately.
          - **Grey, borderless expanded pill** (23dp squircle radius): no border, grey body, white bars driven by a rolling history of real microphone RMS levels.
          - **Two sharp minimal buttons while recording**: ✕ stop &amp; discard (nothing is typed or copied) and ✓ stop &amp; type.
          - **Direct typing into the native keyboard**: partial transcripts stream live via `setComposingText` while you speak and commit on stop; with no text box focused, the transcript is copied once to the clipboard. Enable “QuickSTT Voice Auto-Type” in Settings → Voice Auto-Type (or the onboarding) to use it.
          - **Fast onload, 30 s idle auto-offload**: the model onloads when dictation starts (in-RAM worker / pinned weights), and the RAM watchdog offloads it 30 seconds after you stop speaking. Round loading spinner throughout.
          - **5-page interactive onboarding**: dark grey, vector-drawn pages for microphone, floating pill, Voice Auto-Type keyboard and the built-in model — all permissions moved out of the app.
          - **Lean main screen**: testing surface only (transcript, dictate, downloaded-model strip, keyboard test). All bubble and permission controls live in Settings.

          ### Android (arm64-v8a)
          ```bash
          wget -O /tmp/quickstt.apk https://github.com/__REPO__/releases/download/__VER__/quickstt-android-release.apk
          adb install -r /tmp/quickstt.apk
          ```
          The bundled Cactus Whistle 16M model (`whistle.cact`) is embedded in the APK and transcribes offline on first launch. Additional real models (Whisper, Moonshine, SenseVoice, Canary, Parakeet, Nemotron, Qwen3-ASR) are one tap away in Models.

          ### Checksums
          See `SHA256SUMS`.
          NOTES
          sed -i "s|__VER__|${VER}|g; s|__REPO__|${REPO}|g" /tmp/notes.md
          cat /tmp/notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: /tmp/notes.md
          generate_release_notes: true
