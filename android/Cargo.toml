[package]
name = "quickstt-android"
version = "0.1.6"
edition = "2021"
publish = false

# Its own workspace: the desktop workspace builds for Windows/Linux only.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

# The model download is done by the Android HTTP stack (the Java helper
# `ai.quickstt.app.ModelDownloader`), so there is no HTTP dependency in the
# app: the phone's own stack is the one that always works.
#
# The test that checks that every model URL is still reachable does need an
# HTTP client, and it is the only one — a dev-dependency is not part of the
# APK.
[dev-dependencies]
ureq = "2.10"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-android-activity-06",
    "renderer-software",
] }
# JNI: clipboard, microphone permission, and the floating overlay bubble.
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
] }

[build-dependencies]
slint-build = "1.17"
# Compiles the AAudio capture shim for Android targets.
cc = "1.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# ── APK metadata (cargo-apk generates AndroidManifest.xml from this) ────────
[package.metadata.android]
package = "ai.quickstt.app"
apk_name = "quickstt-android"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

# The model download. Without this the app cannot open a single socket, so
# every download fails with a network error.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

# Microphone: the dictation engine.
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"

# Always-on pill: a foreground service keeps the engine alive off-screen.
[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_MICROPHONE"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

# Do not let the system put QuickSTT to sleep in the background: the bubble
# has to keep working while the user works in another app.
[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"

# Draw the mic pill above other apps (the user grants this in Settings).
[[package.metadata.android.uses_permission]]
name = "android.permission.SYSTEM_ALERT_WINDOW"

# Type into the app in front with real key events. It is a system
# permission, so it only becomes usable on a rooted phone or a userdebug
# build ("adb shell pm grant ai.quickstt.app android.permission.INJECT_EVENTS");
# without it the app falls back to the clipboard.
[[package.metadata.android.uses_permission]]
name = "android.permission.INJECT_EVENTS"

[[package.metadata.android.uses_feature]]
name = "android.hardware.microphone"
required = true

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[package.metadata.android.application]
label = "QuickSTT"
theme = "@android:style/Theme.Black.NoTitleBar.Fullscreen"
# The floating bubble is built by a small Java helper (a View.OnClickListener
# cannot be created from JNI), so the APK carries a dex.
has_code = true
# The speech engines ship in the APK's lib directory and have to be unpacked
# into the app's native library directory: that is the only place where
# Android lets an app run a program (the home directory is mounted noexec).
# Without this flag the installer keeps the libraries inside the APK and the
# engines can never be started.
extract_native_libs = true

# Local release signing (the keystore is NOT in the repo — see android/README.md).
[package.metadata.android.signing.release]
path = "quickstt-release.jks"
keystore_password = "quickstt"
key_password = "quickstt"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|uiMode|density"
orientation = "fullUser"
launch_mode = "singleTask"
exported = true


