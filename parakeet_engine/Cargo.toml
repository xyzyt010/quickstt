[package]
name = "parakeet_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
transcribe-rs = { version = "0.3.3", features = ["onnx"] }
# Load onnxruntime at runtime (ORT_DYLIB_PATH) instead of linking ort's
# prebuilt static lib, which requires a newer glibc than Mint 21 / Ubuntu 22.04.
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hound = "3.5"
base64 = "0.22"
