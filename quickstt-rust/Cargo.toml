[workspace]
members = ["quickstt-core", "quickstt-gui", "quickstt-ipc", "quickstt-slint"]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.11"
edition = "2021"
authors = ["QuickSTT Team <support@quickstt.com>"]
license = "MIT"

[workspace.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_Networking_WinSock",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "System",
] }
raw-window-handle = "0.6.2"
dirs = "5.0"
toml = "0.8"

tokio = { version = "1.35", features = ["full", "process", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "2"
once_cell = "1.19"
async-trait = "0.1"
hound = "3.5"

# ML Dependencies — optional at crate level
livekit-wakeword = "0.1"
whisper-rs = "0.11"

# Audio Dependencies — optional at crate level
cpal = "0.15"
dasp = { version = "0.11", features = ["signal", "ring_buffer"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.release.build-override]
opt-level = 3
