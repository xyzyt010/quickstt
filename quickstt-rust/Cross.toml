# Cross.toml — cross-rs config for amd64 builds from ARM64 host (129.151.239.19)
# Host is Ubuntu ARM64 (aarch64) but artifacts must be x86_64 (amd64).
# Usage: cross build --target x86_64-unknown-linux-gnu --release
[target.x86_64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture amd64 || true",
  "apt-get update && apt-get install -y --no-install-recommends pkg-config libgtk-3-dev:amd64 libayatana-appindicator3-dev:amd64 librsvg2-dev:amd64 libasound2-dev:amd64 libpulse-dev:amd64 libx11-dev:amd64 libxi-dev:amd64 libxtst-dev:amd64 libxdo-dev:amd64 libssl-dev:amd64 libglib2.0-dev:amd64 || apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpulse-dev libx11-dev libxi-dev libxtst-dev",
  "echo 'cross sysroot ready for gtk/appindicator on x86_64'"
]
# Docker image with Rust + Ubuntu 22.04 base (glibc 2.35) to keep debs portable
[target.x86_64-unknown-linux-gnu.image]
name = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main"

# Fallback for native aarch64 builds (just install native deps if needed)
[target.aarch64-unknown-linux-gnu]
pre-build = [
  "apt-get update && apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpulse-dev libx11-dev libxi-dev libxtst-dev || true"
]
