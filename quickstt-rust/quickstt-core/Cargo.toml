[package]
name = "quickstt-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
quickstt-ipc = { path = "../quickstt-ipc" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
async-trait = { workspace = true }
hound = { workspace = true }

# ML — optional
livekit-wakeword = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }

# Audio — optional
cpal = { workspace = true, optional = true }
dasp = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[features]
default = []
wakeword = ["livekit-wakeword", "audio-capture"]
audio-capture = ["cpal", "dasp"]
native-ml = ["wakeword", "audio-capture", "whisper-rs"]
