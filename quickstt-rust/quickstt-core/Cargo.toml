[package]
name = "quickstt-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
quickstt-ipc = { path = "../quickstt-ipc" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
async-trait = { workspace = true }
hound = { workspace = true }

# ML — optional
whisper-rs = { workspace = true, optional = true }
# Direct ort access for the bundled-phrase OWW runtime (same tract backend
# livekit uses; versions pinned to livekit-wakeword 0.1.3's tree).
ort = { workspace = true, optional = true }
ort-tract = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }

# Audio — optional
cpal = { workspace = true, optional = true }
dasp = { workspace = true, optional = true }

# Model downloads + runtime loading
ureq = "2.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[features]
default = []
wakeword = ["ort", "ort-tract", "ndarray", "audio-capture"]
audio-capture = ["cpal", "dasp"]
native-ml = ["wakeword", "audio-capture", "whisper-rs"]

# Mirror livekit-wakeword: tract backend everywhere except aarch64 Windows.
[target.'cfg(not(all(target_arch = "aarch64", target_os = "windows", target_env = "msvc")))'.dependencies]
ort = { workspace = true, features = ["alternative-backend"], optional = true }
