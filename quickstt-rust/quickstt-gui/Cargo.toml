[package]
name = "quickstt-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "QuickSTT — floating offline voice typing pill with wakeword for Linux and Windows"

[[bin]]
name = "QuickSTT"
path = "src/main.rs"

[dependencies]
quickstt-core = { path = "../quickstt-core" }
quickstt-ipc = { path = "../quickstt-ipc" }
dirs = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# GUI Dependencies — cross-platform (egui/eframe glow works on Linux with gtk feature)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
tray-icon = "0.17"
global-hotkey = "0.6"
muda = "0.14"
raw-window-handle = { workspace = true }
resvg = "0.44"
usvg = "0.44"
image = "0.25"
hound = { workspace = true }

[features]
default = ["wakeword", "audio-capture"]
wakeword = ["quickstt-core/wakeword"]
audio-capture = ["quickstt-core/audio-capture"]
native-ml = ["quickstt-core/native-ml"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
dirs = { workspace = true }
gtk = "0.18"

[build-dependencies]
winresource = "0.1.17"

[package.metadata.deb]
name = "quickstt"
maintainer = "QuickSTT Team <support@quickstt.com>"
copyright = "2024-2026, QuickSTT Team <support@quickstt.com>"
extended-description = """\
Floating voice typing widget for Linux — X11 & Wayland, transparent always-on-top.
 Includes integrated STT backends: Vosk small EN, Parakeet TDT 0.6B, Nemotron 3.5 streaming."""
section = "utils"
priority = "optional"
depends = "libgtk-3-0, libayatana-appindicator3-1 | libappindicator3-1, librsvg2-2, libasound2, libpulse0, libx11-6, libxi6, libxtst6, libglib2.0-0, libqt6core6, libqt6gui6, libqt6widgets6, libqt6svg6, libqt6network6"
assets = [
  ["../target/release/QuickSTT", "usr/bin/quickstt", "755"],
  ["../assets/quickstt.desktop", "usr/share/applications/quickstt.desktop", "644"],
  ["../assets/icon_app.png", "usr/share/pixmaps/quickstt.png", "644"],
  ["../assets/icon_app.png", "usr/share/icons/hicolor/256x256/apps/quickstt.png", "644"],
  ["../assets/quickstt-app-wrapper.sh", "usr/bin/quickstt-app", "755"],
  ["../../build/quickstt-app", "usr/lib/quickstt/quickstt-app", "755"],
  ["../../build/stt_service", "usr/lib/quickstt/stt_service", "755"],
  ["../target/release/tools/parakeet/parakeet_engine", "usr/lib/quickstt/tools/parakeet/parakeet_engine", "755"],
  ["../target/release/tools/nemotron/transcribe-cli", "usr/lib/quickstt/tools/nemotron/transcribe-cli", "755"],
  ["../wakeword_models/agent/config.json", "usr/lib/quickstt/wakeword_models/agent/config.json", "644"],
  ["../wakeword_models/agent/model.onnx", "usr/lib/quickstt/wakeword_models/agent/model.onnx", "644"],
  ["../wakeword_models/agent/model.pt", "usr/lib/quickstt/wakeword_models/agent/model.pt", "644"],
  ["../wakeword_models/alexa/config.json", "usr/lib/quickstt/wakeword_models/alexa/config.json", "644"],
  ["../wakeword_models/alexa/model.onnx", "usr/lib/quickstt/wakeword_models/alexa/model.onnx", "644"],
  ["../wakeword_models/alexa/model.pt", "usr/lib/quickstt/wakeword_models/alexa/model.pt", "644"],
  ["../wakeword_models/hem/config.json", "usr/lib/quickstt/wakeword_models/hem/config.json", "644"],
  ["../wakeword_models/hem/model.onnx", "usr/lib/quickstt/wakeword_models/hem/model.onnx", "644"],
  ["../wakeword_models/hem/model.pt", "usr/lib/quickstt/wakeword_models/hem/model.pt", "644"],
  ["../wakeword_models/hey_jarvis/config.json", "usr/lib/quickstt/wakeword_models/hey_jarvis/config.json", "644"],
  ["../wakeword_models/hey_jarvis/model.onnx", "usr/lib/quickstt/wakeword_models/hey_jarvis/model.onnx", "644"],
  ["../wakeword_models/hey_jarvis/model.pt", "usr/lib/quickstt/wakeword_models/hey_jarvis/model.pt", "644"],
  ["../wakeword_models/jarvis/config.json", "usr/lib/quickstt/wakeword_models/jarvis/config.json", "644"],
  ["../wakeword_models/jarvis/model.onnx", "usr/lib/quickstt/wakeword_models/jarvis/model.onnx", "644"],
  ["../wakeword_models/jarvis/model.pt", "usr/lib/quickstt/wakeword_models/jarvis/model.pt", "644"],
]
